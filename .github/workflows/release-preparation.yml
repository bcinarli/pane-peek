name: Prepare GitHub release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA on main with successful build/test and privacy runs
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: github-release-preparation-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare review assets
    if: github.ref == 'refs/heads/main' && github.actor == 'bcinarli' && github.triggering_actor == 'bcinarli'
    runs-on: macos-26
    timeout-minutes: 65
    environment: github-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out trusted main workflow source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify reviewed source and CI
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-review.mjs verify "$RELEASE_COMMIT"
          git switch --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Test release configuration
        run: node scripts/test.mjs --configuration release --arch arm64

      - name: Sign, notarise and package the app
        id: package
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_CERTIFICATE_PASSWORD }}
          RELEASE_SIGNING_IDENTITY: ${{ secrets.RELEASE_SIGNING_IDENTITY }}
          RELEASE_APPLE_ID: ${{ secrets.RELEASE_APPLE_ID }}
          RELEASE_TEAM_ID: ${{ secrets.RELEASE_TEAM_ID }}
          RELEASE_NOTARY_PASSWORD: ${{ secrets.RELEASE_NOTARY_PASSWORD }}
        run: node scripts/hosted-release.mjs

      - name: Remove temporary signing credentials
        if: ${{ always() }}
        run: node scripts/hosted-release.mjs cleanup

      - name: Verify downloads and prepare draft notes
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.package_directory }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          DISK_IMAGE_CHECKSUM: ${{ steps.package.outputs.disk_image_checksum }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain)"
          (cd "$PACKAGE_DIRECTORY" && shasum -a 256 -c "$CHECKSUM" "$DISK_IMAGE_CHECKSUM")
          extracted=$(mktemp -d "$RUNNER_TEMP/panepeek-release.XXXXXX")
          ditto -x -k "$ARCHIVE" "$extracted"
          diff -rq "$PACKAGE_DIRECTORY/PanePeek.app" "$extracted/PanePeek.app"
          test -x "$extracted/PanePeek.app/Contents/MacOS/PanePeek"
          codesign --verify --deep --strict "$extracted/PanePeek.app"
          xcrun stapler validate "$extracted/PanePeek.app"
          spctl --assess --type execute "$extracted/PanePeek.app"
          node scripts/release-review.mjs notes "$PACKAGE_DIRECTORY"

      - name: Upload review assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PanePeek-${{ steps.package.outputs.version }}-build${{ steps.package.outputs.build }}-review
          path: |
            ${{ steps.package.outputs.disk_image }}
            ${{ steps.package.outputs.disk_image_checksum }}
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.package_directory }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

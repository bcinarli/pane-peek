      <stop offset="0" stop-color="#24273A"/>
      <stop offset="1" stop-color="#292D3F"/>
    </radialGradient>
  </defs>
  <g id="background"><rect width="1254" height="1254" fill="url(#icon-background)"/></g>
  <defs>
    <linearGradient id="rear-mauve" x1="610" y1="340" x2="882" y2="745" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BD98EF"/>
      <stop offset="0.55" stop-color="#B692EB"/>
      <stop offset="1" stop-color="#BB95EE"/>

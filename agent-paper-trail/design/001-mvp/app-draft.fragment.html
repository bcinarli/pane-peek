      const current=Array.from(main.querySelectorAll('.pp-pane')).map(element=>element.dataset.pane);
      if(current.join()!==state.order.join()){
        state.order.forEach(pane=>main.insertBefore(q('[data-pane="'+pane+'"]'),q('.pp-details')));
      }
      state.order.forEach((pane,index)=>{
        const element=q('[data-pane="'+pane+'"]');
        element.hidden=state.layout==='single'&&pane!==state.active;
        const label=state.layout==='single'?'Directory':(index===0?'Left directory':'Right directory');
        element.setAttribute('aria-label',label);
        element.querySelector('.pp-breadcrumb').setAttribute('aria-label',label+' breadcrumbs');
      });
      win.querySelectorAll('[data-layout]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.layout===state.layout)));
      renderDesign();
    }
    function setLayout(layout) {
      if(!['single','dual'].includes(layout)) return;
      if(layout==='dual'&&state.layout==='single'){
        state.order=[state.active,state.active==='left'?'right':'left'];
      }
      state.layout=layout;
      hideMenu();renderLayout();persist();
      status(layout==='single'?'One browser pane. The other directory is retained.':'The preserved directory is restored on the right.');
    }
    function toggleDetails() {
      if(design.detailsWidth===50){design.detailsWidth=state.restoreWidth;}
      else{state.restoreWidth=design.detailsWidth;design.detailsWidth=50;}
      renderDesign();persist();
      status(design.detailsWidth===50?'Details expanded to the available maximum.':'Previous Details width restored.');
    }
    function detailsBounds(width) {
      const browserCount=state.layout==='dual'?2:1;
      return {minimum:280,maximum:Math.min(width/2,width-browserCount*251)};
    }
    function resizeDetails(pixels) {
      const width=q('.pp-main').getBoundingClientRect().width;
      if(!width)return;
      const {minimum,maximum}=detailsBounds(width);
      design.detailsWidth=Math.max(minimum,Math.min(maximum,pixels))/width*100;
      renderDesign();
    }
    function renderDesign() {
      win.style.colorScheme=design.appearance==='System'?'':design.appearance.toLowerCase();
      win.style.setProperty('--pp-row',design.rowHeight+'px');
      const width=q('.pp-main').getBoundingClientRect().width;
      if(!width)return;
      const narrow=width<800;
      win.dataset.narrow=String(narrow);
      const {minimum,maximum}=detailsBounds(width);
      const actual=Math.max(minimum,Math.min(width*design.detailsWidth/100,maximum));
      win.style.setProperty('--pp-details',actual+'px');
      const expanded=design.detailsWidth===50;
      const expand=q('.pp-expand');
      const label=expanded?'Restore Details width':'Expand Details';
      expand.setAttribute('aria-label',label);expand.setAttribute('aria-pressed',String(expanded));expand.dataset.tooltip=label;
      const icon=expanded?'minimize-2':'maximize-2';
      if(expand.dataset.icon!==icon){expand.innerHTML='<i data-lucide="'+icon+'" aria-hidden="true"></i>';expand.dataset.icon=icon;icons();}
      q('[data-resize-details]').setAttribute('aria-label','Details width '+Math.round(actual/width*100)+'%. Drag or use left and right arrow keys.');
    }
    const resize=q('[data-resize-details]');
    resize.addEventListener('pointerdown',event=>{if(event.button===0){resize.setPointerCapture(event.pointerId);event.preventDefault();}});
    resize.addEventListener('pointermove',event=>{
      if(!resize.hasPointerCapture(event.pointerId))return;
      const box=q('.pp-main').getBoundingClientRect();
      resizeDetails(box.right-event.clientX);
    });
    resize.addEventListener('pointerup',()=>persist());
    resize.addEventListener('keydown',event=>{
      if(!['ArrowLeft','ArrowRight'].includes(event.key))return;
      event.preventDefault();
      const width=q('.pp-main').getBoundingClientRect().width;
      const current=q('.pp-details').getBoundingClientRect().width;
      resizeDetails(current+width*(event.key==='ArrowLeft'?0.01:-0.01));
      persist();
    });
    new ResizeObserver(()=>renderDesign()).observe(q('.pp-main'));
    loadDocument();
    if(index===2){state.buffer+='\nReview the navigation options with the agent.\n';state.dirty=true;q('.pp-editor').value=state.buffer;}
    render();renderDesign();
    views.push({id,state,design,restoreView,renderFavouriteButtons});
    if(globalThis.Tweak){
      const tweak=new Tweak({container:win,onChange:()=>{renderDesign();persist();}});
      tweak.addSelect(design,'appearance',{label:'Appearance preview',options:['System','Light','Dark']});
      tweak.addSlider(design,'detailsWidth',{label:'Details width',min:22,max:50,unit:'%'});
      tweak.addSlider(design,'rowHeight',{label:'List spacing',min:24,max:36,unit:'px'});
    }
  });
  function persist() {
    if(!window.openai?.setWidgetState){return;}
    const settings=Object.fromEntries(views.map(v=>[v.id,{
      ...v.design,layout:v.state.layout,order:v.state.order,active:v.state.active,restoreWidth:v.state.restoreWidth
    }]));
    window.openai.setWidgetState({
      modelContent:{revision:6,accent:'Mauve',favourites,designs:Object.entries(settings).map(([variant,preferences])=>({variant,...preferences}))},
      privateContent:{revision:6,favourites,...settings}
    }).catch(()=>{});
  }
  window.addEventListener('openai:set_globals',event=>{
    const incoming=event.detail?.globals?.widgetState?.privateContent;
    if(![6].includes(incoming?.revision)){return;}
    if(Array.isArray(incoming.favourites)){favourites=incoming.favourites.filter(f=>typeof f.path==='string'&&typeof f.name==='string'&&Object.hasOwn(sample,f.path));}
    views.forEach(v=>{
      if(incoming[v.id]){v.restoreView(incoming[v.id]);}
      v.renderFavouriteButtons();
    });
  });
})();
</script>

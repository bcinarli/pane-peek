<template id="pp-template">
  <header class="pp-topbar"><div class="pp-traffic" aria-hidden="true"><span></span><span></span><span></span></div><span class="pp-title">PanePeek</span><div class="pp-tools" role="group" aria-label="Directory controls"><button class="cursor-interaction" data-action="go-folder" aria-label="Go to folder" data-tooltip="Go to folder · ⌘L"><i data-lucide="folder-open" aria-hidden="true"></i></button><button class="cursor-interaction" data-action="favourites" aria-label="Favourites" data-tooltip="Favourites"><i data-lucide="star" aria-hidden="true"></i></button><button class="cursor-interaction" data-action="directory-menu" aria-label="Directory actions" data-tooltip="Directory actions"><i data-lucide="sliders-horizontal" aria-hidden="true"></i></button></div></header>
  <div class="pp-main">
    <section class="pp-pane" data-pane="left" aria-label="Left directory"></section>
    <section class="pp-pane" data-pane="right" aria-label="Right directory"></section>
    <aside class="pp-details" aria-label="File details and editor">
      <div class="pp-detailheading"><span>Details</span></div>
      <div class="pp-filetitle"><i data-lucide="file-code" aria-hidden="true"></i><strong class="pp-documentname"></strong><span class="pp-dirty" hidden>Unsaved</span></div>
      <div class="pp-modebar"><div class="pp-segment" role="group" aria-label="Document mode"><button class="cursor-interaction" data-mode="preview" aria-pressed="true">Preview</button><button class="cursor-interaction" data-mode="edit" aria-pressed="false">Edit</button></div><button class="pp-save cursor-interaction" disabled>Save</button></div>
      <div class="pp-codearea" data-editing="false"><pre class="pp-preview" aria-label="File preview"></pre><textarea class="pp-editor" aria-label="Edit selected file" spellcheck="false" wrap="soft" hidden></textarea></div>
      <div class="pp-filepath"><div class="pp-pathheading"><span class="pp-label">Absolute path</span><button class="pp-copyfile cursor-interaction" data-action="copy-file" aria-label="Copy selected file absolute path" data-tooltip="Copy absolute path"><i data-lucide="copy" aria-hidden="true"></i></button></div><code class="pp-absolutepath"></code></div>
      <dl class="pp-metadata"></dl>
    </aside>
  </div>
  <div class="pp-status" aria-live="polite">Ready</div>
  <div class="pp-menu" aria-label="Directory and file actions" hidden></div>
  <div class="pp-sheet" hidden><div class="pp-dialog" role="dialog" aria-modal="true" aria-label="PanePeek action"></div></div>
</template>
<script>
(() => {
  const root = document.getElementById('panepeek-design');
  const template = document.getElementById('pp-template');
  const sample = {
    '/': [{name:'Users',folder:true}],
    '/Users': [{name:'bilal',folder:true}],
    '/Users/bilal': [{name:'Code',folder:true},{name:'Downloads',folder:true}],
    '/Users/bilal/Code': [{name:'website',folder:true}],
    '/Users/bilal/Code/website': [{name:'src',folder:true},{name:'README.md',text:'# Website\n\nA small personal website.\n',type:'Markdown'}],
    '/Users/bilal/Code/website/src': [
      {name:'components',folder:true},{name:'styles',folder:true},
      {name:'App.tsx',type:'TypeScript / JSX',text:"export default function App() {\n  return <main>Hello</main>;\n}\n"},
      {name:'config.xml',type:'XML',text:'<?xml version="1.0"?>\n<site>\n  <title>Personal website</title>\n</site>\n'},
      {name:'index.ts',type:'TypeScript',text:"import App from './App';\n\nexport { App };\n"},
      {name:'notes.txt',type:'Plain text',text:'Keep navigation simple.\nMake full paths easy to copy.\n'},
      {name:'theme.ts',type:'TypeScript',text:"// Quiet colours, clear focus\nexport const theme = {\n  accent: '#C6A0F6',\n  background: 'system',\n  rowHeight: 35,\n};\n"},
      {name:'.env.example',type:'Plain text',text:'PUBLIC_TITLE=Website\n',hidden:true}
    ],
    '/Users/bilal/Code/website/src/components': [{name:'Header.tsx',type:'TypeScript / JSX',text:'export function Header() {\n  return <header>Website</header>;\n}\n'}],
    '/Users/bilal/Code/website/src/styles': [{name:'global.css',type:'CSS',text:'body {\n  margin: 0;\n  color: #252c2d;\n}\n'}],
    '/Users/bilal/Downloads': [{name:'Exports',folder:true},{name:'Archive',folder:true},{name:'draft.md',type:'Markdown',text:'# Draft\n\nNotes for the next release.\n'},{name:'settings.json',type:'JSON',text:'{\n  "theme": "system",\n  "autosave": false\n}\n'}],
    '/Users/bilal/Downloads/Exports': [],
    '/Users/bilal/Downloads/Archive': []
  };
  const escape = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const join = (dir,name) => dir === '/' ? '/' + name : dir + '/' + name;
  const icons = () => { if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}}); };
  const views = [];
  const saved = window.openai?.widgetState;
  let favourites = Array.isArray(saved?.privateContent?.favourites)
    ? saved.privateContent.favourites.filter(f=>typeof f.path==='string'&&typeof f.name==='string'&&Object.hasOwn(sample,f.path))
    : [{name:'Website source',path:'/Users/bilal/Code/website/src'},{name:'Downloads',path:'/Users/bilal/Downloads'}];
  ['pp-balanced','pp-edit'].forEach((id,index) => {
    const win = root.querySelector('#'+id);
    win.append(template.content.cloneNode(true));
    const dirs = Object.fromEntries(Object.entries(sample).map(([path,files]) => [path,files.map((file,i)=>({...file,modified:Date.UTC(2026,9,file.folder?2:3,14,20)-i*1800000}))]));
    const state = {left:'/Users/bilal/Code/website/src',right:'/Users/bilal/Downloads',active:'left',selected:{left:'theme.ts',right:null},mode:index?'edit':'preview',buffer:'',original:'',dirty:false,hidden:{left:false,right:false},sort:{left:'name',right:'name'}};
    const design = {appearance:'System',rowHeight:35,detailsWidth:index?46:32};
    if ([2,3].includes(saved?.privateContent?.revision) && saved.privateContent[id]) Object.assign(design,saved.privateContent[id]);
    const q = selector => win.querySelector(selector);
    const status = message => { q('.pp-status').textContent=message; };
    const file = () => (dirs[state[state.active]]||[]).find(f=>f.name===state.selected[state.active]);
    const fullpath = () => file() ? join(state[state.active],file().name) : state[state.active];
    const hideMenu = () => { q('.pp-menu').hidden=true; };
    const hideSheet = () => { q('.pp-sheet').hidden=true; };
    const sheet = html => { hideMenu(); q('.pp-dialog').onclick=null; q('.pp-dialog').innerHTML=html; q('.pp-sheet').hidden=false; const control=q('.pp-dialog input,.pp-dialog button'); control?.focus(); };
    function menu(heading,items,event) {
      const popup=q('.pp-menu');
      popup.innerHTML='<div class="pp-menuheading">'+escape(heading)+'</div>'+items.map((item,i)=>item?'<button class="cursor-interaction" data-command="'+i+'">'+escape(item.label)+'</button>':'<hr>').join('');
      popup.hidden=false;
      const box=win.getBoundingClientRect();
      const anchor=event.currentTarget===win?event.target.getBoundingClientRect():box;
      const x=event.type==='contextmenu'?event.clientX-box.left:anchor.right-box.left-popup.offsetWidth;
      const y=event.type==='contextmenu'?event.clientY-box.top:anchor.bottom-box.top+4;
      popup.style.left=Math.max(8,Math.min(x,box.width-popup.offsetWidth-8))+'px';
      popup.style.top=Math.max(8,Math.min(y,box.height-popup.offsetHeight-8))+'px';
      popup.onclick=e=>{const button=e.target.closest('[data-command]');if(button){hideMenu();items[Number(button.dataset.command)].run();}};
      popup.querySelector('button')?.focus();
    }
    function guard(action) {
      if (!state.dirty) { action(); return; }
      sheet('<h3>Save changes to '+escape(file()?.name||'this file')+'?</h3><p>Changing selection will close this document.</p><div class="pp-actions"><button class="cursor-interaction" data-guard="cancel">Cancel</button><button class="cursor-interaction" data-guard="discard">Discard</button><button class="cursor-interaction pp-primary" data-guard="save">Save</button></div>');
      q('.pp-dialog').onclick = event => {
        const choice=event.target.closest('[data-guard]')?.dataset.guard;
        if (!choice) return;
        hideSheet();
        if (choice==='cancel') return;
        if (choice==='save') save();
        state.dirty=false;
        action();
      };
    }
    function loadDocument() {
      const selected=file();
      state.buffer=selected?.text||'';
      state.original=state.buffer;
      state.dirty=false;
      q('.pp-editor').value=state.buffer;
    }
    function save() {
      const selected=file();
      if (selected && !selected.folder) selected.text=state.buffer;
      state.original=state.buffer;
      state.dirty=false;
      renderDetails();
      status('Saved in this draft.');
    }
    function navigate(pane,path) {
      if (!Object.hasOwn(dirs,path)) { status('This sample directory is unavailable. The current directory is unchanged.'); return; }
      if(state.active===pane && state[pane]===path){return;}
      guard(()=>{const changed=state[pane]!==path;state.active=pane;state[pane]=path;if(changed){state.selected[pane]=null;}loadDocument();render();});
    }
    function renderPane(pane) {
      const element=q('[data-pane="'+pane+'"]');
      const path=state[pane];
      element.dataset.active=String(state.active===pane);
      const parts=path.split('/').filter(Boolean);
      let crumb='<button class="cursor-interaction" data-go="/" aria-label="Filesystem root"'+(path==='/'?' aria-current="location"':'')+'>/</button>';
      parts.forEach((part,i)=>{const destination='/'+parts.slice(0,i+1).join('/');crumb+='<span class="pp-chevron" aria-hidden="true">›</span><button class="cursor-interaction" data-go="'+escape(destination)+'" data-tooltip="'+escape(destination)+'"'+(destination===path?' aria-current="location"':'')+'>'+escape(part)+'</button>';});
      const listing=(dirs[path]||[]).filter(f=>state.hidden[pane]||!f.hidden).slice().sort((a,b)=>Number(b.folder||false)-Number(a.folder||false)||a.name.localeCompare(b.name,undefined,{numeric:true}));
      if(state.sort[pane]==='modified') listing.sort((a,b)=>Number(b.folder||false)-Number(a.folder||false)||b.modified-a.modified||a.name.localeCompare(b.name,undefined,{numeric:true}));
      element.innerHTML='<div class="pp-location"><button class="cursor-interaction" data-go="/Users/bilal" aria-label="Home directory" data-tooltip="Go home"><i data-lucide="house" aria-hidden="true"></i></button><nav class="pp-breadcrumb" aria-label="'+pane+' directory breadcrumbs">'+crumb+'</nav><button class="pp-favourite cursor-interaction" data-toggle-favourite aria-label="Add directory to favourites" aria-pressed="false"><i data-lucide="star" aria-hidden="true"></i></button></div><div class="pp-listhead"><button class="cursor-interaction" data-sort="name">Name '+(state.sort[pane]==='name'?'↑':'')+'</button><button class="cursor-interaction" data-sort="modified">Modified '+(state.sort[pane]==='modified'?'↓':'')+'</button></div><div class="pp-list">'+(listing.length?listing.map(f=>'<button class="pp-row cursor-interaction" data-select="'+escape(f.name)+'" aria-pressed="'+(state.selected[pane]===f.name)+'"><i data-lucide="'+(f.folder?'folder':'file-text')+'" class="'+(f.folder?'pp-folder':'')+'" aria-hidden="true"></i><span class="pp-name">'+escape(f.name)+'</span><span class="pp-date">'+(f.folder?'Yesterday':'Today')+'</span></button>').join(''):'<div class="pp-empty">This folder is empty.</div>')+'</div><div class="pp-foot"><span class="pp-count">'+listing.length+' items</span></div>';
    }
    function renderFavouriteButtons() {
      ['left','right'].forEach(pane=>{
        const button=q('[data-pane="'+pane+'"] [data-toggle-favourite]');
        const added=favourites.some(f=>f.path===state[pane]);
        const label=added?'Remove directory from favourites':'Add directory to favourites';
        button.setAttribute('aria-pressed',String(added));
        button.setAttribute('aria-label',label);
        button.dataset.tooltip=label;
      });
    }
    function highlight(text) {
      return text.split('\n').map(line=>{
        if(line.trim().startsWith('//')||line.trim().startsWith('#')) return '<span class="pp-comment">'+escape(line)+'</span>';
        return line.split(/('[^']*'|"[^"]*"|\b(?:export|default|const|return|function|import|from|true|false|null)\b|\b\d+(?:\.\d+)?\b)/g).map(part=>/^['"]/.test(part)?'<span class="pp-string">'+escape(part)+'</span>':/^(export|default|const|return|function|import|from|true|false|null)$/.test(part)?'<span class="pp-keyword">'+escape(part)+'</span>':/^\d/.test(part)?'<span class="pp-number">'+escape(part)+'</span>':escape(part)).join('');
      }).join('\n');
    }
    function renderDetails() {
      const selected=file();
      const editable=selected&&!selected.folder;
      q('.pp-documentname').textContent=selected?.name||'No selection';
      q('.pp-dirty').hidden=!state.dirty;
      win.querySelectorAll('[data-mode]').forEach(button=>{button.disabled=!editable;button.setAttribute('aria-pressed',String(button.dataset.mode===state.mode));});
      q('.pp-save').disabled=!state.dirty;
      q('.pp-editor').hidden=state.mode!=='edit'||!editable;
      q('.pp-codearea').dataset.editing=String(state.mode==='edit'&&editable);
      q('.pp-preview').setAttribute('aria-hidden',String(state.mode==='edit'&&editable));
      q('.pp-preview').innerHTML=editable?(/\.(ts|tsx|js|json|md)$/.test(selected.name)?highlight(state.buffer):escape(state.buffer)):(selected?'No text preview for folders.':'Select a file to preview it.');
      if(editable && state.mode==='edit') { q('.pp-editor').scrollTop=0; }
      q('.pp-absolutepath').textContent=selected?fullpath():'No item selected';
      q('.pp-copyfile').disabled=!selected;
      q('.pp-metadata').innerHTML=selected?'<dt>Type</dt><dd>'+escape(selected.folder?'Folder':selected.type||'Plain text')+'</dd><dt>Size</dt><dd>'+(selected.folder?'Unavailable':new TextEncoder().encode(selected.text||'').length+' bytes')+'</dd><dt>Modified</dt><dd>'+new Date(selected.modified).toLocaleString('en-GB',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+'</dd><dt>Created</dt><dd>2 Oct 2026, 09:15</dd><dt>Permissions</dt><dd>'+(selected.folder?'0755 · rwxr-xr-x':'0644 · rw-r--r--')+'</dd><dt>Owner / group</dt><dd>bilal / staff</dd>':'';
    }
    function render() {renderPane('left');renderPane('right');renderFavouriteButtons();renderDetails();icons();}
    async function copyPath(path) {
      try { if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(path);status('Path copied.');return;} } catch {}
      sheet('<h3>Copy path</h3><label>Copy with ⌘C</label><textarea rows="3" readonly aria-label="Path to copy">'+escape(path)+'</textarea><div class="pp-actions"><button class="cursor-interaction" data-dismiss>Done</button></div>');
      const field=q('.pp-dialog textarea');field.focus();field.select();
    }
    function pathEntry(pane) {
      sheet('<h3>Go to folder</h3><label for="'+id+'-directory">Absolute directory path</label><input id="'+id+'-directory" value="'+escape(state[pane])+'" spellcheck="false"><div class="pp-actions"><button class="cursor-interaction" data-dismiss>Cancel</button><button class="cursor-interaction pp-primary" data-open>Open</button></div>');
      q('.pp-dialog input').select();
      q('[data-open]').onclick=()=>{const path=q('.pp-dialog input').value.trim().replace(/\/$/,'')||'/';hideSheet();navigate(pane,path);};
      q('.pp-dialog input').onkeydown=event=>{if(event.key==='Enter')q('[data-open]').click();};
    }
    function transfer(pane,operation) {
      const target=pane==='left'?'right':'left';
      const selected=file();
      if(!selected)return;
      const sourcePath=state[pane],targetPath=state[target];
      if(dirs[targetPath].some(f=>f.name===selected.name)){status('A file named '+selected.name+' already exists in '+targetPath+'.');return;}
      const apply=()=>guard(()=>{
        dirs[targetPath].push({...selected});
        if(operation==='move'){dirs[sourcePath]=dirs[sourcePath].filter(f=>f!==selected);state.selected[pane]=null;loadDocument();}
        render();status((operation==='copy'?'Copied':'Moved')+' to '+targetPath+' in this draft.');
      });
      if(operation==='copy'){apply();return;}
      sheet('<h3>Move '+escape(selected.name)+'?</h3><p>From '+escape(sourcePath)+'<br>To '+escape(targetPath)+'</p><div class="pp-actions"><button class="cursor-interaction" data-dismiss>Cancel</button><button class="cursor-interaction pp-primary" data-confirm-move>Move</button></div>');
      q('[data-confirm-move]').onclick=()=>{hideSheet();apply();};
    }
    win.addEventListener('click',event=>{
      if(!event.target.closest('.pp-menu')){hideMenu();}
      const button=event.target.closest('button');
      if(!button){const pane=event.target.closest('[data-pane]')?.dataset.pane;if(pane&&pane!==state.active){guard(()=>{state.active=pane;loadDocument();render();});}return;}
      if(button.hasAttribute('data-dismiss')){hideSheet();return;}
      const pane=button.closest('[data-pane]')?.dataset.pane;
      if(button.hasAttribute('data-toggle-favourite')){
        const path=state[pane];
        const existing=favourites.findIndex(f=>f.path===path);
        if(existing<0){favourites.push({name:path.split('/').filter(Boolean).at(-1)||'Filesystem root',path});}
        else{favourites.splice(existing,1);}
        views.forEach(v=>v.renderFavouriteButtons());
        status((existing<0?'Added to':'Removed from')+' favourites: '+path);
        persist();return;
      }
      if(button.dataset.select){if(state.active===pane&&state.selected[pane]===button.dataset.select)return;guard(()=>{state.active=pane;state.selected[pane]=button.dataset.select;loadDocument();render();status(button.dataset.select+' selected in '+pane+' pane.');});return;}
      if(button.dataset.go){navigate(pane,button.dataset.go);return;}
      if(button.dataset.sort){const apply=()=>{if(state.active!==pane){state.active=pane;loadDocument();}state.sort[pane]=button.dataset.sort;render();status('List sorted.');};if(state.active===pane){apply();}else{guard(apply);}return;}
      if(button.dataset.mode){state.mode=button.dataset.mode;renderDetails();return;}
      if(button.classList.contains('pp-save')){save();return;}
      if(button.dataset.action==='copy-file'){copyPath(fullpath());return;}
      if(button.dataset.action==='go-folder'){pathEntry(state.active);return;}
      if(button.dataset.action==='directory-menu'){
        const target=state.active;
        menu(state[target],[
          {label:'Go to folder…',run:()=>pathEntry(target)},
          {label:'Parent folder',run:()=>navigate(target,state[target].split('/').slice(0,-1).join('/')||'/')},
          {label:'Copy directory path',run:()=>copyPath(state[target])},
          null,
          {label:state.hidden[target]?'Hide hidden files':'Show hidden files',run:()=>{state.hidden[target]=!state.hidden[target];render();}},
          {label:'Refresh',run:()=>{render();status('Directory refreshed.');}}
        ],event);return;
      }
      if(button.dataset.action==='favourites'){
        const target=state.active;
        if(!favourites.length){status('No favourites yet. Use the star beside a directory’s breadcrumbs.');return;}
        menu('Favourites',favourites.map(f=>({label:f.name,run:()=>navigate(target,f.path)})),event);
      }
    });
    function fileMenu(event) {
      const row=event.target.closest('[data-select]');
      const pane=row?.closest('[data-pane]')?.dataset.pane;
      if(!row||!pane){return;}
      event.preventDefault();
      const show=()=>{
        const name=state.selected[pane];
        menu(name,[
          {label:'Copy absolute path',run:()=>copyPath(join(state[pane],name))},
          {label:'Copy relative path',run:()=>copyPath(name)},
          null,
          {label:'Copy to other pane',run:()=>transfer(pane,'copy')},
          {label:'Move to other pane',run:()=>transfer(pane,'move')}
        ],event);
      };
      if(state.active===pane&&state.selected[pane]===row.dataset.select){show();}
      else{guard(()=>{state.active=pane;state.selected[pane]=row.dataset.select;loadDocument();render();show();});}
    }
    win.addEventListener('contextmenu',fileMenu);
    win.addEventListener('dblclick',event=>{const row=event.target.closest('[data-select]');const pane=row?.closest('[data-pane]')?.dataset.pane;if(row&&pane){const selected=dirs[state[pane]].find(f=>f.name===row.dataset.select);if(selected?.folder)navigate(pane,join(state[pane],selected.name));}});
    q('.pp-editor').addEventListener('input',()=>{state.buffer=q('.pp-editor').value;state.dirty=state.buffer!==state.original;renderDetails();});
    win.addEventListener('keydown',event=>{if(event.key==='Escape'){hideSheet();hideMenu();return;}if(event.shiftKey&&event.key==='F10'){fileMenu(event);return;}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='l'){event.preventDefault();pathEntry(state.active);}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();if(state.dirty){save();}}});
    function renderDesign() {
      win.style.colorScheme=design.appearance==='System'?'':design.appearance.toLowerCase();
      win.style.setProperty('--pp-row',design.rowHeight+'px');
      win.style.setProperty('--pp-details',design.detailsWidth+'%');
    }
    loadDocument();render();renderDesign();
    views.push({id,design,renderDesign,renderFavouriteButtons});
    if(globalThis.Tweak){
      const tweak=new Tweak({container:win,onChange:()=>{renderDesign();persist();}});
      tweak.addSelect(design,'appearance',{label:'Appearance preview',options:['System','Light','Dark']});
      tweak.addSlider(design,'detailsWidth',{label:'Details width',min:28,max:50,unit:'%'});
      tweak.addSlider(design,'rowHeight',{label:'List spacing',min:30,max:42,unit:'px'});
    }
  });
  function persist(){if(window.openai?.setWidgetState){window.openai.setWidgetState({modelContent:{revision:3,accent:'Mauve',favourites,designs:views.map(v=>({layout:v.id,...v.design}))},privateContent:{revision:3,favourites,...Object.fromEntries(views.map(v=>[v.id,{...v.design}]))}}).catch(()=>{});}}
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent;if([2,3].includes(incoming?.revision)){if(Array.isArray(incoming.favourites)){favourites=incoming.favourites.filter(f=>typeof f.path==='string'&&typeof f.name==='string'&&Object.hasOwn(sample,f.path));}views.forEach(v=>{if(incoming[v.id]){Object.assign(v.design,incoming[v.id]);v.renderDesign();}v.renderFavouriteButtons();});}});
})();
</script>

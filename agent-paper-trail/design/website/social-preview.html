<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PanePeek social preview artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      color: #cad3f5;
      background: radial-gradient(ellipse at 50% 100%, #494d6466, transparent 70%), #24273a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { position: relative; width: 100%; height: 100%; text-align: center; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 14px; padding-top: 40px; }
    .brand img { width: 35px; height: 46px; }
    .brand span { font-size: 32px; font-weight: 650; letter-spacing: -.025em; }
    h1 { margin: 26px 0 0; font-size: 56px; font-weight: 650; line-height: 1.06; letter-spacing: -.045em; }
    h1 span { color: #c6a0f6; }
    .description { margin: 20px 0 0; color: #a5adcb; font-size: 20px; line-height: 1.5; }
    .app-preview {
      position: absolute;
      top: 330px;
      left: 84px;
      width: 1032px;
      margin: 0;
      overflow: hidden;
      border: 1px solid #494d64;
      border-radius: 16px;
      box-shadow: 0 16px 60px #18192680;
      background: #1e2030;
    }
    .app-preview img { display: block; width: 100%; height: auto; margin-top: -4.2693%; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="../../../website/assets/peeking-p.svg" alt="" width="35" height="46">
      <span>PanePeek</span>
    </div>
    <h1>Edit text files<br><span>as you browse.</span></h1>
    <p class="description">File browser and text editor for Mac</p>
    <figure class="app-preview">
      <img src="../../../website/assets/app-edit-dark.png" alt="PanePeek editing a Markdown file in dark mode, with fictional sample documents." width="2436" height="1460">
    </figure>
  </main>
</body>
</html>
